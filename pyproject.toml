[project]
name = "ene-c2-034"
version = "0.1.0"
description = "Generates compliant power grid outage work orders (停電作業指示書) and work-type-specific safety checklists from a structured maintenance request, validated against 電気事業法/労働安全衛生法."
requires-python = ">=3.11"
# agenticstar-agentcore provides the framework and shared services. The
# "openai" extra pulls in langchain-openai (AzureOpenAIClient); "marketplace"
# is required by cli.py's run_agent_marketplace().
dependencies = [
    "agenticstar-agentcore[openai,marketplace]==1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.uv]
# agenticstar-agentcore's published package-index metadata can pin a
# langchain-core version incompatible with what its own "openai" extra
# (-> langchain-openai) requires — confirmed root cause of a
# registry-install-only failure. Force the
# SDK-compatible version the agentcore release actually ships with; re-verify
# this pin if the agenticstar-agentcore version above ever changes.
override-dependencies = [
    "langchain-core==1.5.4",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# agenticstar-agentcore ships without py.typed, so its framework.* and
# shared.* modules resolve as untyped.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# Subclassing framework base classes (FunctionNode, AgentState, ...) is
# unavoidable and resolves to Any; relax only that one strict check for src/.
[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false
