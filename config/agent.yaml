# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block. That nested shape is invisible to the registry.
id: "ENE-C2-034"
name: "Power Grid Maintenance Work Order Generation & Safety Checklist Agent"
namespace: "ene"
version: "0.1.0"
enabled: true
category: "Cat 2"
# The work-order draft is produced by an LLM (Azure OpenAI).
generation_mode: "llm"  # deterministic | llm
industry: "ENE"

# Opaque compatibility metadata (DocGenerationAgent pattern).
base_type: "DocGenerationAgent"

# Entry point — single dotted import path (module.Class).
class: "src.graph.graph.WorkOrderGenerationAgent"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — every ctx.secrets.require("KEY") call must be listed.
requires:
  secrets:
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_DEPLOYMENT
  extras: ["openai"]
